<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil de plan de contenu marketing</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: linear-gradient(to bottom, #6c5ce7, #2f4f7f);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .titre {
            color: #fff;
            text-align: center;
        }

        .outil {
            background-color: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 500px;
            margin-top: 50px;
        }

        input[type="text"] {
            width: 100%;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            background-color: #007bff;
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        .resultat {
            font-size: 24px;
            color: #333;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }

        .bouton-derriere {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background-color: #0f964f;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .bouton-derriere:hover {
            background-color: #0b8333;
        }

        button, .bouton-derriere {
            width: 100%;
        }

        #bloc-texte {
            color: #fff;
            text-align: center;
            margin-top: 50px;
        }

        #bloc-bouton {
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <h1 class="titre">Outil : outil de plan de contenu marketing</h1>
    <div class="outil">
        <input type="text" placeholder="Tapez votre contenu...">
        <input type="text" placeholder="Tapez votre contenu...">
        <input type="text" placeholder="Tapez votre contenu...">
        <button>Calculer</button>
        <p class="resultat">Résultat ici...</p>
    </div>
    <div id="bloc-texte">
        Maintenant que vous avez ce résultat, passez à l'étape supérieure. Découvrez la plateforme n°1 pour créer votre site web, vos tunnels de vente et automatiser tout votre business en un seul endroit.
    </div>
    <div id="bloc-bouton">
        <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" target="_blank">
            <button class="bouton-derriere">Découvrir la plateforme (Essai Gratuit)</button>
        </a>
    </div>
</body>
</html>
