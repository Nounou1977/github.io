
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil de plan de contenu marketing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .result {
            padding: 20px;
            border-bottom: 1px solid #ccc;
            border-radius: 10px 10px 0 0;
            background-color: #f9f9f9;
        }
        
        .bottom {
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 0 0 10px 10px;
        }
        
        .button {
            background-color: #34c759;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .button:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="result">
            <h2>Résultat</h2>
            <p id="result"></p>
        </div>
        <div class="bottom">
            <p>Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web, vos tunnels de vente et automatisez votre business avec Systeme.io.</p>
            <button class="button" onclick="openUrl()">Lancer mon business en ligne (Essai Gratuit)</button>
        </div>
    </div>

    <script>
        function openUrl() {
            window.open("https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89", "_blank");
        }
    </script>
</body>
</html>
