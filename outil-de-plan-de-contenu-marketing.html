<!DOCTYPE html>
<html>
<head>
    <title>Outil de plan de contenu marketing</title>
    <style>
        body {
            background: linear-gradient(to bottom, #7A288A, #1A1D23);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
        }
        
        .outil {
            background: #fff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 80%;
            max-width: 800px;
        }
        
        input[type="text"], textarea {
            width: 100%;
            height: 60px;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            margin-bottom: 20px;
            resize: none;
        }
        
        input[type="text"]:focus, textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 128, 255, 0.5);
        }
        
        button[type="button"] {
            background: #007bff;
            border: none;
            border-radius: 10px;
            padding: 16px 32px;
            font-size: 18px;
            cursor: pointer;
        }
        
        button[type="button"]:hover {
            background: #0056b3;
        }
        
        button[type="button"]:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(0, 128, 255, 0.5);
        }
        
        .resultat {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
        }
        
        .promotion {
            text-align: center;
            margin-top: 50px;
        }
        
        .promotion button {
            background: #34C759;
            border: none;
            border-radius: 10px;
            padding: 16px 32px;
            font-size: 18px;
            cursor: pointer;
        }
        
        .promotion button:hover {
            background: #2ecc71;
        }
        
        .promotion button:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(0, 128, 255, 0.5);
        }
    </style>
</head>
<body>
    <h1>Outil de plan de contenu marketing</h1>
    <div class="outil">
        <input type="text" placeholder="Entrez votre objet">
        <input type="text" placeholder="Entrez votre déclaration">
        <input type="text" placeholder="Entrez votre appel à l'action">
        <button type="button">Calculer</button>
        <p class="resultat"></p>
    </div>
    <div class="promotion">
        <p>Maintenant que vous avez ce résultat, passez à l'étape supérieure. Découvrez la plateforme n°1 pour créer votre site web, vos tunnels de vente et automatiser tout votre business en un seul endroit.</p>
        <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" target="_blank">
            <button type="button">Découvrir la plateforme (Essai Gratuit)</button>
        </a>
    </div>
</body>
</html>
