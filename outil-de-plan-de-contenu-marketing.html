<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil de plan de contenu marketing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .titre {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .conteneur {
            width: 80%;
            margin: 40px auto;
            background-color: #f2f2f2;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        .conteneur-haut {
            background-color: #007bff;
            color: #fff;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .button {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .formulaire {
            margin-bottom: 40px;
        }
        .resultat {
            margin-bottom: 50px;
            padding: 20px;
            background-color: #f2f2f2;
            border: 1px solid #ccc;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="titre">Outil de plan de contenu marketing</div>
    <div class="conteneur">
        <div class="conteneur-haut">Plan de contenu marketing</div>
        <form class="formulaire">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom"><br>
            <label for="description">Description :</label>
            <textarea id="description" name="description"></textarea><br>
            <label for="objectifs">Objectifs :</</label>
            <input type="text" id="objectifs" name="objectifs"><br>
            <button class="button" onclick="calculer()">Calculer</button>
        </form>
        <div id="resultat" class="resultat"></div>
        <div class="message">
            Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web, vos tunnels de vente et automatisez votre business avec Systeme.io.
            <button class="button" onclick="ouvrirPage()">Lancer mon business en ligne (Essai Gratuit)</button>
        </div>
    </div>
    <script>
        function calculer() {
            var nom = document.getElementById("nom").value;
            var description = document.getElementById("description").value;
            var objectifs = document.getElementById("objectifs").value;
            var resultat = "Nom : " + nom + "<br> Description : " + description + "<br> Objectifs : " + objectifs;
            document.getElementById("resultat").innerHTML = resultat;
        }
        function ouvrirPage() {
            window.open("https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89", "_blank");
        }
    </script>
</body>
</html>
