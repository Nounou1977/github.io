<!DOCTYPE html>
<html>
<head>
    <title>Outil de plan de contenu marketing</title>
    <style>
        html, body {
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: linear-gradient(to bottom, #0000FF, #00698f);
            background-size: 100% 100%;
            background-attachment: fixed;
        }
        
        #outil {
            width: 400px;
            height: 400px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
            margin: auto;
            padding: 40px;
            text-align: center;
        }
        
        .input-field {
            width: 80%;
            height: 40px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 16px;
        }
        
        .input-field:focus {
            border: 1px solid blue;
        }
        
        .button {
            width: 100%;
            height: 40px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: blue;
            color: white;
            cursor: pointer;
        }
        
        .button:hover {
            background-color: #00698f;
        }
        
        .result {
            font-size: 24px;
            font-weight: bold;
            color: #00698f;
            margin: 20px 0;
        }
        
        .bottom-text {
            text-align: center;
            color: white;
            margin-top: 50px;
        }
        
        .affiliation-button {
            width: 50%;
            height: 40px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: green;
            color: white;
            cursor: pointer;
            margin: auto;
        }
        
        .affiliation-button:hover {
            background-color: #008000;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: white; margin-top: 10vh;">Outil : outil de plan de contenu marketing</h1>
    <div id="outil">
        <input type="text" class="input-field" placeholder="Entrez votre nom">
        <input type="text" class="input-field" placeholder="Entrez votre email">
        <input type="text" class="input-field" placeholder="Entrez votre sujet">
        <button class="button">Calculer</button>
        <p class="result"></p>
    </div>
    <p class="bottom-text">Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web et automatisez votre business avec Systeme.io.</p>

</body>
</html>
