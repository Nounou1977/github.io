<!DOCTYPE html>
<html>
<head>
    <title>Outil de plan de contenu marketing</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom, #6c5ce7, #2f4f7f);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        h1 {
            color: #fff;
            margin-bottom: 20px;
        }
        
        .carte {
            background-color: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        input[type="text"] {
            height: 40px;
            width: 80%;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        input[type="text"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1), 0 0 5px rgba(0, 128, 255, 0.5);
        }
        
        button[type="button"] {
            background-color: #007bff;
            color: #fff;
            padding: 20px 40px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        
        button[type="button"]:focus {
            outline: none;
        }
        
        button[type="button"]:hover {
            background-color: #0056b3;
        }
        
        p {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        a {
            text-decoration: none;
            color: #fff;
        }
        
        .affiliation {
            background-color: #34c759;
            padding: 20px 40px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 80%;
            max-width: 500px;
        }
        
        .affiliation a {
            color: #fff;
        }
        
        .affiliation:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    <h1>Outil : outil de plan de contenu marketing</h1>
    <div class="carte">
        <input type="text" placeholder="Champ 1">
        <input type="text" placeholder="Champ 2">
        <input type="text" placeholder="Champ 3">
        <button type="button">Calculer</button>
        <p>Résultat</p>
    </div>
    <p style="color: #fff; margin-top: 50px;">Maintenant que vous avez ce résultat, passez à l'étape supérieure. Découvrez la plateforme n°1 pour créer votre site web, vos tunnels de vente et automatiser tout votre business en un seul endroit.</p>
    <div class="affiliation">
        <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" target="_blank">Découvrir la plateforme (Essai Gratuit)</a>
    </div>
</body>
</html>
