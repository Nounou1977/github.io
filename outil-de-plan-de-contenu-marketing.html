<!DOCTYPE html>
<html>
<head>
	<title>Outil plan de contenu marketing</title>
	<style>
		body {
			background-image: linear-gradient(to bottom, rgb(100, 0, 255), rgb(0, 0, 100));
			height: 100vh;
			margin: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			font-family: 'Segoe UI', Arial, sans-serif;
		}

		div {
			background-color: white;
			border-radius: 20px;
			box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
			padding: 40px;
		}

		input[type="text"] {
			width: 100%;
			height: 40px;
			padding: 10px;
			border: 1px solid #ccc;
			border-radius: 5px;
			box-sizing: border-box;
			background-color: #f7f7f7;
		}

		input[type="text"]:focus {
			border-color: blue;
			outline: none;
			box-shadow: 0px 0px 10px blue;
		}

		button[type="button"] {
			background-color: blue;
			width: 100%;
			height: 40px;
			padding: 10px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			color: white;
		}

		button[type="button"]:hover {
			background-color: darkblue;
		}

		p {
			color: black;
			font-size: 24px;
			margin-top: 20px;
		}

		.affiliation {
			background-color: green;
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
			cursor: pointer;
			width: 80%;
		}

		.affiliation:hover {
			background-color: darkgreen;
		}

		.affiliation a {
			text-decoration: none;
			color: white;
		}
	</style>
</head>
<body>
	<h1 style="color: white;">Outil : outil de plan de contenu marketing</h1>
	<div>
		<input type="text" placeholder="Entrez votre contenu ici..."><br>
		<button type="button">Calculer</button>
		<p id="resultat"></p>
	</div>
	<p style="margin-top: 50px; color: white;">Maintenant que vous avez ce résultat, passez à l'étape supérieure. Découvrez la plateforme n°1 pour créer votre site web, vos tunnels de vente et automatiser tout votre business en un seul endroit.</p>
	<div class="affiliation">
		<a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" target="_blank">Découvrir la plateforme (Essai Gratuit)</a>
	</div>
</body>
</html>
