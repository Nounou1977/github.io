
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil de plan de contenu marketing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        container {
            width: 80%;
            margin: 40px auto;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .resultat {
            width: 100%;
            margin-bottom: 20px;
            padding: 20px;
            background-color: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .button {
            width: 100%;
            height: 50px;
            background-color: #4CAF50;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #3e8e41;
        }

        .affiliation {
            margin-top: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Outil de plan de contenu marketing</h1>
        <form>
            <label for="contenu">Entrez le contenu de votre publication :</label>
            <textarea id="contenu" name="contenu" rows="5" cols="40"></textarea>
        </form>
        <button class="button" onclick="calculerResultat()">Calculer</button>
        <div class="resultat" id="resultat"></div>
        <div class="affiliation">
            Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web, vos tunnels de vente et automatisez votre business avec Systeme.io.
            <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" class="button" target="_blank">
                Lancer mon business en ligne (Essai Gratuit)
            </a>
        </div>
    </div>
    <script>
        function calculerResultat() {
            var contenu = document.getElementById("contenu").value;
            var resultat = document.getElementById("resultat");
            resultat.innerHTML = "Le contenu de votre publication est : " + contenu;
        }
    </script>
</body>
</html>
