<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil : calculateur de tarifs freelance gratuit</title>
    <style>
        body {
            background-image: linear-gradient(to bottom, #4c6ef3, #2f5c7f);
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
        }
        
        .carte {
            width: 400px;
            margin-top: 50px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            background-color: white;
            border: 1px solid #ddd;
        }
        
        .carte input[type="text"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            width: 100%;
        }
        
        .carte input[type="text"]:hover, .carte input[type="text"]:focus {
            border-color: #4c6ef3;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        
        .carte button {
            padding: 10px 20px;
            background-color: #4c6ef3;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
            width: 100%;
            cursor: pointer;
        }
        
        .carte button:hover {
            background-color: #2f5c7f;
        }
        
        .resultat {
            font-size: 24px;
            color: #333;
            margin-top: 20px;
        }
        
        .affiliation {
            width: 100%;
            height: 40px;
            border-radius: 5px;
            background-color: #2ecc71;
            text-align: center;
            padding-top: 5px;
            cursor: pointer;
        }
        
        .affiliation:hover {
            background-color: #1abe6a;
        }
    </style>
</head>
<body>
    <h1 style="color: white;">Outil : calculateur de tarifs freelance gratuit</h1>
    
    <div class="carte">
        <input type="text" placeholder="Heure de travail">
        <input type="text" placeholder="Tarif par heure">
        <button>Cálculer</button>
        <p class="resultat"></p>
    </div>
    
    <p style="margin-top: 50px; color: white;">Maintenant que vous avez ce résultat, passez à l'étape supérieure. Découvrez la plateforme n°1 pour créer votre site web, vos tunnels de vente et automatiser tout votre business en un seul endroit.</p>
    
    <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" class="affiliation">
        <p style="color: white; padding: 10px;">Découvrir la plateforme (Essai Gratuit)</p>
    </a>
</body>
</html>
