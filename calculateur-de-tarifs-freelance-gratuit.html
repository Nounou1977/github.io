
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil calculateur de tarifs freelance gratuit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .resultat {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 50%;
        }

        .bouton {
            background-color: #2ecc71;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 50px 0;
        }

        .bouton:hover {
            background-color: #34c759;
        }

        .link {
            text-decoration: none;
            color: #333;
        }

        .link:hover {
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Outil calculateur de tarifs freelance gratuit</h1>
        <div class="resultat">
            <h2>Résultat du calcul :</h2>
            <p id="resultat"></p>
        </div>
        <div style="width: 100%;"></div>
        <p>Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web, vos tunnels de vente et automatisez votre business avec Systeme.io.</p>
        <button class="bouton"><a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" class="link">Lancer mon business en ligne (Essai Gratuit)</a></button>
    </div>

    <script>
        function calculTarifs() {
            // Récupération des valeurs des inputs
            var heuresParMois = document.getElementById("heuresParMois").value;
            var prixParHeure = document.getElementById("prixParHeure").value;

            // Calcul du résultat
            var resultat = heuresParMois * prixParHeure * 12;

            // Affichage du résultat
            document.getElementById("resultat").innerHTML = "Vous gagnerez " + resultat + "€ par an.";
        }

        function init() {
            document.getElementById("heuresParMois").addEventListener("input", calculTarifs);
            document.getElementById("prixParHeure").addEventListener("input", calculTarifs);
        }

        init();
    </script>

    <form>
        <label for="heuresParMois">Heures travaillées par mois :</label>
        <input type="number" id="heuresParMois" value="100">
        <br><br>
        <label for="prixParHeure">Prix de l'heure de travail :</label>
        <input type="number" id="prixParHeure" value="20">
    </form>
</body>
</html>
