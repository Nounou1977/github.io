<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>Outil : calculateur de tarifs freelance gratuit</title>
    <style>
        @media (max-width: 600px) {
            body {
                font-size: 14px;
            }
        }
        body {
            background-image: linear-gradient(to bottom, #6c5ce7, #2f4f7f);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .carte {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 500px;
            max-width: 90vw;
        }
        .input-field {
            width: 100%;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .input-field:focus {
            border-color: blue;
            outline: none;
            box-shadow: 0 0 10px blue;
        }
        .bouton {
            background-color: blue;
            padding: 20px 40px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }
        .bouton:hover {
            background-color: #0057ff;
        }
        #resultat {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }
        .affiliation {
            background-color: #34c759;
            padding: 20px 40px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }
        .affiliation:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    <h1 style="color: white;">Outil : calculateur de tarifs freelance gratuit</h1>
    <div class="carte">
        <form>
            <input type="text" class="input-field" placeholder="Prix par heure" style="height: 50px;">
            <input type="text" class="input-field" placeholder="Temps de travail" style="height: 50px;">
            <input type="text" class="input-field" placeholder="Pourcentage de commission" style="height: 50px;">
            <button class="bouton" type="submit">Calculer</button>
        </form>
        <p id="resultat"></p>
    </div>
    <p style="color: white; margin-top: 50px;">Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web et automatisez votre business avec Systeme.io.</p>

        Lancer mon business en ligne (Essai Gratuit)
    </a>

</html>
