<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil calculateur de tarifs freelance gratuit</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #6c5ce7, #2e4053);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .carte {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            text-align: center;
            position: relative;
        }
        
        .carte input {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .carte input:focus {
            border-color: blue;
            box-shadow: 0 0 10px blue;
        }
        
        .btn-calcul {
            background-color: blue;
            padding: 20px 40px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            width: 100%;
            font-size: 20px;
        }
        
        .btn-calcul:hover {
            background-color: #0055ff;
        }
        
        .resultat {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        .texte-infos {
            margin-top: 50px;
            text-align: center;
            color: white;
            font-size: 18px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
        
        .affiliation {
            background-color: green;
            padding: 20px 40px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            font-size: 20px;
            text-decoration: none;
        }
        
        .affiliation:hover {
            background-color: #00ff00;
        }
        
        .affiliation:visited {
            color: white;
        }
    </style>
</head>
<body>
    <h1>Outil : calculateur de tarifs freelance gratuit</h1>
    <div class="carte">
        <input type="number" placeholder="Entrer votre heure travaillé">
        <input type="number" placeholder="Entrer votre taux horaire">
        <button class="btn-calcul" onclick="calculTarif()">Calculer</button>
        <p class="resultat" id="resultat"></p>
    </div>
    <p class="texte-infos">Maintenant que vous avez ce résultat, passez à l'étape supérieure. Découvrez la plateforme n°1 pour créer votre site web, vos tunnels de vente et automatiser tout votre business en un seul endroit.</p>
    <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" class="affiliation">Découvrir la plateforme (Essai Gratuit)</a>
    <script>
        function calculTarif() {
            var heure = document.querySelector('input[type="number"]').value;
            var taux = document.querySelector('input[type="number"]').nextSibling.value;
            if (heure != '' && taux != '') {
                var tarif = parseFloat(heure) * parseFloat(taux);
                document.getElementById('resultat').innerHTML = 'Votre tarif est de : ' + tarif.toLocaleString('fr-FR') + ' €';
            } else {
                document.getElementById('resultat').innerHTML = 'Veuillez renseigner toutes les informations nécessaires';
            }
        }
    </script>
</body>
</html>
