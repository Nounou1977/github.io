<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-image: linear-gradient(to bottom, #4b0082, #1a1d23);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        .card {
            width: 800px;
            height: 600px;
            border-radius: 20px;
            box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.2);
            padding: 40px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        input[type="text"] {
            width: 100%;
            height: 40px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        input[type="text"]:focus {
            border-color: #00bfff;
        }
        
        button {
            width: 100%;
            height: 40px;
            background-color: #00bfff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        button:hover {
            background-color: #0080ff;
        }
        
        #resultat {
            width: 100%;
            height: 200px;
            padding: 20px;
            font-size: 24px;
            color: #333;
        }
        
        .footer {
            margin-top: 50px;
            text-align: center;
        }
        
        .footer button {
            width: 100%;
            height: 40px;
            background-color: #4CAF50;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .footer button:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>
    <h1 style="color: #fff;">Outil : simulateur de rentabilite de liste email</h1>
    <div class="card">
        <input type="text" placeholder="Nombre de contacts">
        <input type="text" placeholder="Taux de conversion">
        <input type="text" placeholder="Valeur moyenne d'une transaction">
        <button>Cálculer</button>
        <div id="resultat"></div>
    </div>
    <div class="footer">
        <p style="color: #fff;">Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web et automatisez votre business avec Systeme.io.</p>
        <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" target="_blank">
            <button>Lancer mon business en ligne (Essai Gratuit)</button>
        </a>
    </div>
</body>
</html>
