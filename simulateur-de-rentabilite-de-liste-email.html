
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil simulateur de rentabilité de liste email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .resultat {
            background-color: #f7f7f7;
            padding: 20px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .bouton {
            background-color: #2ecc71;
            color: #fff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .bouton:hover {
            background-color: #34c759;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Résultat du calcul de rentabilité de liste email</h1>
        <div class="resultat">
            <p id="resultat"></p>
        </div>
        <button class="bouton" id="bouton-affiliation">
            Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web, vos tunnels de vente et automatisez votre business avec Systeme.io.
            <span>Lancer mon business en ligne (Essai Gratuit)</span>
        </button>
    </div>
    <script>
        // Code JavaScript pour calculer la rentabilité de liste email
        const resultat = document.getElementById('resultat');
        const boutonAffiliation = document.getElementById('bouton-affiliation');
        
        // Exemple de données pour le calcul
        const donnees = {
            liste_email: 1000,
            ouverture: 0.1,
            clic: 0.01,
            conversion: 0.001
        };
        
        // Calcul de la rentabilité de liste email
        const calcul = () => {
            const ouverture = donnees.liste_email * donnees.ouverture;
            const clic = ouverture * donnees.clic;
            const conversion = clic * donnees.conversion;
            const resultat_calc = `${donnees.liste_email} emails traités -> ${ouverture.toFixed(2)}% d'ouverture -> ${clic.toFixed(2)} clics -> ${conversion.toFixed(2)} conversions`;
            resultat.textContent = resultat_calc;
        };
        
        // Exécuter le calcul
        calcul();
        
        // Ajouter un événement de clique au bouton d'affiliation
        boutonAffiliation.addEventListener('click', () => {
            window.open('https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89', '_blank');
        });
    </script>
</body>
</html>
