<!DOCTYPE html>
<html>
<head>
    <title>Outil simulateur de rentabilité de liste email</title>
    <style>
        body {
            background-image: linear-gradient(to bottom, #8F0A1A, #2F4F7F);
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
        }
        
        #outil {
            background-color: #FFFFFF;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            margin-top: 50px;
        }
        
        #outil input[type="text"], #outil textarea {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        #outil input[type="text"]:focus, #outil textarea:focus {
            border-color: #007bff;
        }
        
        #outil button[type="button"] {
            background-color: #007bff;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
        }
        
        #outil button[type="button"]:hover {
            background-color: #0069d9;
        }
        
        #resultat {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        #affiliation {
            background-color: #32CD32;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
        }
        
        #affiliation:hover {
            background-color: #2ecc71;
        }
        
        .message {
            margin-top: 50px;
            color: #fff;
        }
        
        .affiliation {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 style="color: #fff; text-align: center;">Outil : simulateur de rentabilité de liste email</h1>
    <div id="outil" style="max-width: 800px; margin: 0 auto;">
        <input type="text" placeholder="Nombre de contacts...">
        <input type="text" placeholder="Taux de lecture...">
        <input type="text" placeholder="Clique par mail...">
        <button type="button">Calculer</button>
        <div id="resultat"></div>
    </div>
    <div class="message">Maintenant que vous avez ce résultat, passez à l'étape supérieure. Découvrez la plateforme n°1 pour créer votre site web, vos tunnels de vente et automatiser tout votre business en un seul endroit.</div>
    <div class="affiliation">
        <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" target="_blank">
            <button class="affiliation" id="affiliation" style="padding: 15px; font-size: 18px;">Découvrir la plateforme (Essai Gratuit)</button>
        </a>
    </div>
</body>
</html>
