<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generateur d'Idées de Noms d'Entreprise</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-image: linear-gradient(to bottom, #8f0a1a, #03055B);
      background-size: 100% 300px;
      background-position: 0 100px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .carte {
      width: 80%;
      max-width: 800px;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.5s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .input-group {
      margin-top: 20px;
    }

    .input-group input {
      width: 100%;
      height: 50px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 20px;
      transition: all 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px #007bff;
    }

    .bouton {
      background-color: #007bff;
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .bouton:hover {
      opacity: 0.8;
    }

    .resultat {
      font-size: 24px;
      font-weight: bold;
      color: #000;
    }

    #partenariat {
      margin-top: 50px;
      text-align: center;
    }

    #partenariat a {
      background-color: #3e8e41;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s;
    }

    #partenariat a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1 style="color: #fff; margin-bottom: 20px;">Outil : générateur d'idées de nom d'entreprise</h1>
  <div class="carte">
    <div class="input-group">
      <input type="text" placeholder="Saisir une phrase">
    </div>
    <div class="input-group">
      <input type="text" placeholder="Saisir un adjectif">
    </div>
    <div class="input-group">
      <input type="text" placeholder="Saisir un verbe">
    </div>
    <button class="bouton" onclick="genererNom()">Générer</button>
    <p class="resultat" id="resultat"></p>
  </div>
  <div id="partenariat">
    <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" target="_blank">Lancer mon business en ligne (Essai Gratuit)</a>
  </div>
  <script>
    function genererNom() {
      const phrase = document.querySelector('.input-group input:nth-child(1)').value;
      const adjectif = document.querySelector('.input-group input:nth-child(2)').value;
      const verbe = document.querySelector('.input-group input:nth-child(3)').value;

      if (phrase && adjectif && verbe) {
        const resultat = `${adjectif} ${verbe} ${phrase}`;
        document.getElementById('resultat').innerText = resultat;
      } else {
        alert('Veuillez saisir toutes les informations requises');
      }
    }
  </script>
</body>
</html>
