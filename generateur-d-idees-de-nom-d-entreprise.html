<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil : Generateur d'Idées de Nom d'Entreprise</title>
    <style>
        body {
            background-image: linear-gradient(to bottom, #800080, #0000ff);
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 500px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group input {
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #ddd;
            width: 100%;
        }
        .input-group input:focus {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 0, 255, 0.2);
        }
        .btn {
            background-color: #007bff;
            padding: 20px;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .result {
            font-size: 24px;
            color: #333;
        }
        .call-to-action {
            margin-top: 50px;
            text-align: center;
        }
        .cta-btn {
            background-color: #34c759;
            padding: 20px;
            border-radius: 20px;
            color: #fff;
            width: 100%;
            cursor: pointer;
        }
        .cta-btn:hover {
            background-color: #2eac41;
        }
    </style>
</head>
<body>
    <h1 style="color: #fff; text-align: center; margin-bottom: 20px;">Outil : Generateur d'Idées de Nom d'Entreprise</h1>
    <div class="container">
        <div class="input-group">
            <input type="text" placeholder="Enter votre nom">
        </div>
        <div class="input-group">
            <input type="text" placeholder="Enter votre métier">
        </div>
        <button class="btn" onclick="genererNom()">Calculer</button>
        <p class="result"></p>
    </div>
    <div class="call-to-action">
        <p style="color: #fff;">Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web et automatisez votre business avec Systeme.io.</p>
    </div>
    <button class="cta-btn" onclick="location.href='https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89';">Lancer mon business en ligne (Essai Gratuit)</button>
</body>
</html>
