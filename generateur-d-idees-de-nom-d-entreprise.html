<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil Générateur de Nom d'Entreprise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 80%;
            margin: 50px auto;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .resultat {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .bouton {
            background-color: #2ecc71;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .bouton:hover {
            background-color: #34c759;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Outil Générateur de Nom d'Entreprise</h1>
        <input type="text" id="premis" placeholder="Entrez un adjectif">
        <input type="text" id="suffis" placeholder="Entrez un suffixe">
        <button onclick="genererNom()">Générer</button>
        <div class="resultat" id="resultat"></div>
        <p>Vous êtes prêt à lancer votre business en ligne ?</p>
        <p>Pour créer votre site web, vos tunnels de vente et automatiser votre business avec Systeme.io, cliquez sur le bouton ci-dessous.</p>
        <button class="bouton" onclick="afficherLien()">Lancer mon business en ligne (Essai Gratuit)</button>
    </div>

    <script>
        function genererNom() {
            var prenom = document.getElementById("premis").value;
            var suffis = document.getElementById("suffis").value;
            var resultat = prenom.charAt(0).toUpperCase() + prenom.slice(1) + suffis.charAt(0).toUpperCase() + suffis.slice(1);
            document.getElementById("resultat").textContent = resultat;
        }

        function afficherLien() {
            window.location.href = "https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89";
        }
    </script>
</body>
</html>
