			align-items: center;

			font-size: 18px;
			text-align: center;
		}

		.affiliate-button {
			background-color: #3E8E41;
			color: #FFFFFF;
			border: none;
			border-radius: 10px;
			padding: 10px 20px;
			font-size: 18px;
			cursor: pointer;
		}

		.affiliate-button:hover {
			background-color: #2F6C39;
		}
	</style>
</head>
<body>
	<h1 style="color: #FFFFFF;">Outil : generateur d'idees de nom d'entreprise</h1>
