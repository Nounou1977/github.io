<!DOCTYPE html>
<html>
<head>
    <title>Outil calculateur de prix de formation en ligne</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: linear-gradient(to bottom, #8000ff, #00008b);
            background-size: 100% 500px;
            background-position: 0 0;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .carte {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }
        
        .inputs {
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .bouton {
            background-color: blue;
            color: white;
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .bouton:hover {
            background-color: #00bfff;
        }
        
        .resultat {
            font-size: 36px;
            font-weight: bold;
            color: #000;
        }
        
        .affiliation {
            background-color: #008000;
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .affiliation:hover {
            background-color: #00b300;
        }
        
        .affiliation-text {
            color: white;
            text-decoration: none;
        }
        
        .texte {
            text-align: center;
            color: white;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <h1 style="color: white;">Outil : calculateur de prix de formation en ligne</h1>
    <div class="carte">
        <input type="text" class="inputs" placeholder="Coût de la formation (en €)"><br>
        <input type="text" class="inputs" placeholder="Pourcentage de bénéfice"><br>
        <input type="text" class="inputs" placeholder="Nb de participants"><br>
        <button class="bouton">Calculer</button><br>
        <p class="resultat"></p>
    </div>
    <p class="texte">Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web et automatisez votre business avec Systeme.io.</p>
    <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89" class="affiliation">
        <span class="affiliation-text">Lancer mon business en ligne (Essai Gratuit)</span>
    </a>
</body>
</html>
