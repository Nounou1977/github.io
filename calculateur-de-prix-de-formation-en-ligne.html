<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil calculateur de prix de formation en ligne</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #formulaire {
            width: 80%;
            margin: 40px auto;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        #resultat {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        #resultat h2 {
            color: #333;
            margin-top: 0;
        }
        #bouton-affiliation {
            background-color: #2ecc71;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: 50px auto;
        }
        #bouton-affiliation:hover {
            background-color: #2ecc6c;
        }
    </style>
</head>
<body>
    <div id="formulaire">
        <h2>Outil calculateur de prix de formation en ligne</h2>
        <form>
            <label for="nombre-participants">Nombre de participants : </label>
            <input type="number" id="nombre-participants" name="nombre-participants" value="0">
            <br><br>
            <label for="duree-formation">Durée de la formation (en heures) : </label>
            <input type="number" id="duree-formation" name="duree-formation" value="0">
            <br><br>
            <button id="calculer">Calculer le prix de la formation</button>
        </form>
    </div>
    <div id="resultat">
        <h2>Résultat:</h2>
        <p id="resultat-prix"></p>
    </div>
    <button id="bouton-affiliation">Lancer mon business en ligne (Essai Gratuit)</button>
    <script>
        document.getElementById('calculer').addEventListener('click', function() {
            var nombreParticipants = document.getElementById('nombre-participants').value;
            var dureeFormation = document.getElementById('duree-formation').value;
            var prixFormation = nombreParticipants * dureeFormation * 50;
            document.getElementById('resultat-prix').innerHTML = 'Le prix de la formation est de ' + prixFormation + ' euros.';
        });
        document.getElementById('bouton-affiliation').href = 'https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89';
        document.getElementById('bouton-affiliation').onclick = function() {
            alert('Maintenant que vous avez ce résultat, passez à l\'étape suivante. Créez votre site web, vos tunnels de vente et automatisez votre business avec Systeme.io.');
        };
    </script>
</body>
</html>
