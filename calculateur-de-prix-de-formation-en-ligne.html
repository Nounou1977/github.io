<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de prix de formation en ligne</title>
    <style>
        body {
            background: linear-gradient(to top, #6c5ce7, #2f4f7f);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 800px;
            display: flex;
            flex-direction: column;
        }

        input[type="text"] {
            width: 100%;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 127, 255, 0.5);
        }

        .button {
            background: #007bff;
            padding: 20px 40px;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: #0056b3;
        }

        .result {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
        }

        .affiliation {
            background: #34c759;
            padding: 20px 40px;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .affiliation:hover {
            background: #2ecc71;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #fff;">Outil : calculateur de prix de formation en ligne</h1>
    <div class="card">
        <input type="text" placeholder="Nombre de candidats">
        <input type="text" placeholder="Nombre de sessions">
        <input type="text" placeholder="Durée de chaque session (en heures)">
        <button class="button">Calculer</button>
        <p class="result"></p>
    </div>
    <p style="text-align: center; color: #fff; margin-top: 50px;">Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web et automatisez votre business avec Systeme.io.</p>

</body>
</html>
