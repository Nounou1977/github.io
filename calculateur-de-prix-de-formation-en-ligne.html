
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil calculateur de prix de formation en ligne</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .resultat {
            font-size: 36px;
            font-weight: bold;
            color: #333;
        }
        
        .resultat-container {
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .affiliation {
            position: relative;
            z-index: 1;
        }
        
        .affiliation-btn {
            position: relative;
            z-index: 1;
        }
        
        .affiliation-btn > a {
            text-decoration: none;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 10px;
            background-color: #4CAF50;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .affiliation-btn > a:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Outil calculateur de prix de formation en ligne</h1>
        <input type="number" id="nb-students" placeholder="Nombre d'étudiants">
        <input type="number" id="nb-cours" placeholder="Nombre de cours">
        <button id="calculer-btn">Calculer</button>
        <div class="resultat-container" id="resultat-container">
            <p class="resultat" id="resultat"></p>
        </div>
        <div class="affiliation" style="margin-top: 50px;">
            <p>Maintenant que vous avez ce résultat, passez à l'étape suivante. Créez votre site web, vos tunnels de vente et automatisez votre business avec Systeme.io.</p>
            <div class="affiliation-btn">
                <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89">Lancer mon business en ligne (Essai Gratuit)</a>
            </div>
        </div>
    </div>

    <script>
        const nbStudentsInput = document.getElementById('nb-students');
        const nbCoursInput = document.getElementById('nb-cours');
        const calculerBtn = document.getElementById('calculer-btn');
        const resultatContainer = document.getElementById('resultat-container');
        const resultat = document.getElementById('resultat');

        calculerBtn.addEventListener('click', () => {
            const nbStudents = parseInt(nbStudentsInput.value);
            const nbCours = parseInt(nbCoursInput.value);
            const prixFormation = nbStudents * nbCours * 10;
            resultatContainer.style.display = 'block';
            resultat.textContent = `Le prix de formation est de ${prixFormation} euros.`;
        });
    </script>
</body>
</html>
