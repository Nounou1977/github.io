<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil : calculateur de prix de formation en ligne</title>
    <style>
        body {
            background: linear-gradient(to bottom, #6c5ce7, #2f4f7f);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .carte {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 80%;
            max-width: 500px;
        }
        
        .formulaire {
            margin-bottom: 20px;
        }
        
        input[type="text"] {
            width: 100%;
            height: 40px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        
        input[type="text"]:focus {
            border-color: #007bff;
            border-width: 2px;
        }
        
        button[type="submit"] {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
        
        .resultat {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .appel-action {
            margin-top: 50px;
            text-align: center;
        }
        
        .bouton-verde {
            background-color: #00ff00;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        
        .bouton-verde:hover {
            background-color: #008000;
        }
        
        .bouton-verde img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }
        
        a {
            text-decoration: none;
            color: #333;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1 style="color: #fff;">Outil : calculateur de prix de formation en ligne</h1>
    <div class="carte">
        <form class="formulaire">
            <input type="text" placeholder="Nombre de modules...">
            <input type="text" placeholder="Prix par module...">
            <button type="submit">Calculer</button>
            <br><br>
            <p class="resultat"></p>
        </form>
        <p class="appel-action">Maintenant que vous avez ce résultat, passez à l'étape supérieure. Découvrez la plateforme n°1 pour créer votre site web, vos tunnels de vente et automatiser tout votre business en un seul endroit.</p>
        <div class="bouton-verde">
            <a href="https://systeme.io/fr?sa=sa0005402052e616f3aa5f60c0cf5ad49c228d29ad89">
                <img src="https://www.flaticon.com/svg/static/icons/svg/226/226654.svg" alt="Découvrez la plateforme">
                Découvrir la plateforme (Essai Gratuit)
            </a>
        </div>
    </div>
</body>
</html>
